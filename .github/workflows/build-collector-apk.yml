name: Build Tahseel Collector APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/collector-mobile-app
    paths:
      - 'mobile/collector-app/**'
      - 'public/.well-known/assetlinks.json'
      - '.github/workflows/build-collector-apk.yml'

permissions:
  contents: read

jobs:
  validate-debug-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned debug APK
        working-directory: mobile/collector-app
        run: gradle --no-daemon :app:assembleDebug

  build-release-apk:
    if: github.event_name == 'workflow_dispatch'
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Decode protected release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAHSEEL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tahseel-collector-release.p12"
          chmod 600 "$RUNNER_TEMP/tahseel-collector-release.p12"

      - name: Build signed release APK
        working-directory: mobile/collector-app
        env:
          TAHSEEL_KEYSTORE_FILE: ${{ runner.temp }}/tahseel-collector-release.p12
          TAHSEEL_KEYSTORE_PASSWORD: ${{ secrets.TAHSEEL_ANDROID_KEYSTORE_PASSWORD }}
          TAHSEEL_KEY_ALIAS: tahseel-collector
          TAHSEEL_KEY_PASSWORD: ${{ secrets.TAHSEEL_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release identity and signature
        run: |
          set -euo pipefail
          APK='mobile/collector-app/app/build/outputs/apk/release/app-release.apk'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q '^Number of signers: 1$' "$RUNNER_TEMP/apksigner.txt"

          ACTUAL_PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$ACTUAL_PACKAGE" = 'live.meganet.tahseel.collector'

          ACTUAL_DIGEST=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_DIGEST=$(python3 -c "import json; print(json.load(open('public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0].replace(':', '').lower())")
          test -n "$ACTUAL_DIGEST"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"

          echo "Verified package: $ACTUAL_PACKAGE"
          echo "Verified signer SHA-256: $ACTUAL_DIGEST"

      - name: Prepare named artifact and checksum
        run: |
          cp mobile/collector-app/app/build/outputs/apk/release/app-release.apk tahseel-collector-v1.0.0.apk
          sha256sum tahseel-collector-v1.0.0.apk > tahseel-collector-v1.0.0.apk.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tahseel-collector-apk
          path: |
            tahseel-collector-v1.0.0.apk
            tahseel-collector-v1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
