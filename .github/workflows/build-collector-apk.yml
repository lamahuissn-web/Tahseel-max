name: Build Tahseel Collector APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/collector-mobile-app
    paths:
      - 'mobile/collector-app/**'
      - 'public/.well-known/assetlinks.json'
      - '.github/workflows/build-collector-apk.yml'

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode protected release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAHSEEL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tahseel-collector-release.p12"
          chmod 600 "$RUNNER_TEMP/tahseel-collector-release.p12"

      - name: Build signed release APK
        working-directory: mobile/collector-app
        env:
          TAHSEEL_KEYSTORE_FILE: ${{ runner.temp }}/tahseel-collector-release.p12
          TAHSEEL_KEYSTORE_PASSWORD: ${{ secrets.TAHSEEL_ANDROID_KEYSTORE_PASSWORD }}
          TAHSEEL_KEY_ALIAS: tahseel-collector
          TAHSEEL_KEY_PASSWORD: ${{ secrets.TAHSEEL_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            mobile/collector-app/app/build/outputs/apk/release/app-release.apk
      - name: Prepare named artifact
        run: cp mobile/collector-app/app/build/outputs/apk/release/app-release.apk tahseel-collector-v1.0.0.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tahseel-collector-apk
          path: tahseel-collector-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
