plugins {
    id 'com.android.application'
}

final String releaseStorePath = System.getenv('TAHSEEL_KEYSTORE_FILE') ?: ''
final String releaseStorePassword = System.getenv('TAHSEEL_KEYSTORE_PASSWORD') ?: ''
final String releaseKeyAlias = System.getenv('TAHSEEL_KEY_ALIAS') ?: ''
final String releaseKeyPassword = System.getenv('TAHSEEL_KEY_PASSWORD') ?: ''
final boolean releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

if (releaseRequested && [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].any { it.isEmpty() }) {
    throw new GradleException('Release signing variables are required for a release build.')
}

android {
    namespace "live.meganet.tahseel.collector"
    compileSdk 36

    defaultConfig {
        applicationId "live.meganet.tahseel.collector"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (!releaseStorePath.isEmpty()) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                storeType 'PKCS12'
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
}
